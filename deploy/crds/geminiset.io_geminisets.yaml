apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: geminisets.geminiset.io
spec:
  group: geminiset.io
  names:
    kind: GeminiSet
    listKind: GeminiSetList
    plural: geminisets
    singular: geminiset
    shortNames:
      - gs
      - gset
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .status.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: AI-Status
          type: string
          jsonPath: .status.aiCompilationStatus
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                prompt:
                  type: string
                  description: Freeform human natural language description of the workload, replica count, placement, and constraints.
                replicas:
                  type: integer
                  description: Optional explicit desired number of pod replicas.
                constraints:
                  type: array
                  items:
                    type: string
                  description: Optional explicit natural language guardrails and constraints.
                template:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: Standard PodTemplateSpec override if desired.
                mcpServers:
                  type: array
                  description: Optional Model Context Protocol (MCP) server endpoints for tool calling.
                  items:
                    type: object
                    required:
                      - name
                      - endpoint
                    properties:
                      name:
                        type: string
                      endpoint:
                        type: string
                      description:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                replicas:
                  type: integer
                readyReplicas:
                  type: integer
                availableReplicas:
                  type: integer
                aiCompilationStatus:
                  type: string
                synthesizedSummary:
                  type: string
                aiModelUsed:
                  type: string
                reasoningDurationMs:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
